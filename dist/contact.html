<!DOCTYPE html><html lang="sv"><head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Sidans titel -->
        <title>Kontakta oss</title>
        <!-- Länkar till typsnitt och stilmall -->
        <link rel="stylesheet" href="/about.02bdd06e.css">
        <link rel="stylesheet" href="/contact.366cc337.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    </head>
    <body>
        <!-- Sidhuvudet med logotyp och navigationsmeny -->
        <header class="header">
            <nav class="nav-header">
                <!-- Restaurangens logotyp samt hem-knapp-->
                <a href="/index.html"><img class="logo" src="/logotyp.030c7906.png" alt="Vaviorka logotyp" height="44"></a>
                <!-- Länkar till andra sidor -->
                <ul class="nav-list">
                    <!-- Länk till meny -->
                    <li class="nav-list-item"><a href="/index.html">Meny</a></li>
                    <!-- Länk till bokningssidan -->
                    <li class="nav-list-item"><a href="/booking.html">Boka bord</a></li>
                    <!-- Länk till kontaktsidan -->
                    <li class="nav-list-item"><a href="/contact.html">Kontakta oss</a></li>
                    <!-- Länk till om-sidan -->
                    <li class="nav-list-item"><a href="/about.html">Om oss</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <!-- Sektion med kontaktformulär -->
            <section class="contact-section">
                <h1 class="contact-title">Kontakta oss</h1>
                <!-- Kontaktformulär -->
                <form class="contact-form" id="contactForm">
                    <!-- Namn -->
                    <label class="label" for="contactName">Namn</label>
                    <input class="input" type="text" id="contactName" name="name" placeholder="Namn">

                    <!-- E-post -->
                    <label class="label" for="contactEmail">E-post</label>
                    <input class="input" type="email" id="contactEmail" name="email" placeholder="E-post">

                    <!-- Ämne -->
                    <label class="label" for="contactSubject">Ämne</label>
                    <input class="input" type="text" id="contactSubject" name="subject" placeholder="Ämne">

                    <!-- Meddelande -->
                    <label class="label" for="contactMessage">Meddelande</label>
                    <textarea class="textarea" id="contactMessage" name="message" placeholder="Meddelande"></textarea>

                    <!-- Skicka-knapp för formuläret -->
                    <button class="btn btn-primary" type="submit">Skicka meddelande</button>

                    <!-- Meddelanderuta som visar svar från servern -->
                    <div class="message" id="message"></div>
                </form>
                <!-- Meddelandet som visas när formulär skickas-->
                <p class="contact-thanks" id="thanks-message">
                    Tack för ditt meddelande! Vi återkommer så snart vi kan.
                </p>
            </section>
        </main>

        <!-- Sidfoten med kontaktuppgifter -->
        <footer class="footer">
            <ul class="footer-list">
                <!-- Telefonnummer -->
                <li class="footer-list-item ">+467890970509</li>
                <!-- E-postadress -->
                <li class="footer-list-item">vaviorkadining@hotmail.com</li>
            </ul>
        </footer>
        <!-- JavaScript som hanterar kontaktformuläret -->
        <script src="/contact.72eb4091.js"></script>
    
<script src="/contact.13d043c6.js"></script></body></html>
