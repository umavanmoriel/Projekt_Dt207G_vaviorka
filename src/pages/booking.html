<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Sidans titel -->
        <title>Boka bord</title>
        <!-- Länkar till typsnitt och stilmall -->
        <link rel="stylesheet" href="../css/startsida.css">
        <link rel="stylesheet" href="../css/booking.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    </head>
    <body>
        <!-- Sidhuvudet med logotyp och navigationsmeny -->
        <header class="header">
            <nav class="nav-header">
                <!-- Restaurangens logotyp -->
                <a href="../pages/index.html"><img class="logo" src="../../assets/images/logotyp.png" alt="Vaviorka logotyp" height="44"></a>
                <!-- Länkar till andra sidor -->
                <ul class="nav-list">
                    <!-- Länk till meny -->
                    <li class="nav-list-item"><a href="../pages/index.html">Meny</a></li>
                    <!-- Länk till bokningssidan -->
                    <li class="nav-list-item"><a href="../pages/booking.html">Boka bord</a></li>
                    <!-- Länk till kontaktsidan -->
                    <li class="nav-list-item"><a href="../pages/contact.html">Kontakta oss</a></li>
                    <!-- Länk till om-sidan -->
                    <li class="nav-list-item"><a href="../pages/about.html">Om oss</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <!-- Formulär för att boka bord -->
            <form class="booking-form" id="bookingForm">
                <h1 class="booking-title">Boka bord</h1>
                <!-- Namn -->
                <label class="label" for="guestName">Namn</label>
                <input class="input" type="text" id="guestName" name="name" placeholder="Namn">

                <!-- Telefonnummer -->
                <label class="label" for="guestPhone">Telefonnummer</label>
                <input class="input" type="tel" id="guestPhone" name="phone" placeholder="Telefonnummer">

                <!-- Datum och tid för bokning -->
                <div class="booking-row">
                    <div>
                        <label class="label" for="bookingDate">Datum</label>
                        <input class="input" type="date" id="bookingDate" name="date">
                    </div>
                    <div>
                        <label class="label" for="bookingTime">Tid</label>
                        <input class="input" type="time" id="bookingTime" name="time">
                    </div>
                </div>

                <!-- Antal gäster -->
                <label class="label" for="guestCount">Antal gäster</label>
                <input class="input" type="number" id="guestCount" name="guests" value="2" min="1" max="20">

                <!-- Meddelande -->
                <label class="label" for="bookingMessage">Meddelande</label>
                <textarea class="textarea" id="bookingMessage" name="message" placeholder="Meddelande"></textarea>

                <!-- Skicka-knapp som skickar formuläret till backend-->
                <button class="btn btn-primary" type="submit">Skicka förfrågan</button>

                <!-- Meddelande som visas efter skickat formulär -->
                <div class="message" id="message"></div>

            </form>
        </main>

        <!-- Sidfoten med kontaktuppgifter -->
        <footer class="footer">
            <ul class="footer-list">
                <!-- Telefonnummer -->
                <li class="footer-list-item ">+467890970509</li>
                <!-- E-postadress -->
                <li class="footer-list-item">vaviorkadining@hotmail.com</li>
            </ul>
        </footer>
        <!-- JavaScript som hanterar bokningsformuläret -->
        <script src="../js/booking.js"></script>
    </body>
</html>
