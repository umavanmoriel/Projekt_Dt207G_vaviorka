<!DOCTYPE html>
<html lang="sv">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Sidans titel -->
        <title>Vaviorka</title>
        <!-- Länkar till typsnitt och stilmall -->
        <link rel="stylesheet" href="../css/startsida.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    </head>
    <body>
        <!-- Sidhuvudet med logotyp och navigationsmeny -->
        <header class="header">
            <nav class="nav-header">
                <!-- Restaurangens logotyp samt hem-knapp-->
                <a href="../pages/index.html"><img class="logo" src="../../assets/images/logotyp.png" alt="Vaviorka logotyp" height="44"></a>
                <!-- Länkar till andra sidor -->
                <ul class="nav-list">
                    <!-- Länk till bokningssidan -->
                    <li class="nav-list-item"><a href="../pages/booking.html">Boka bord</a></li>
                    <!-- Länk till kontaktsidan -->
                    <li class="nav-list-item"><a href="../pages/contact.html">Kontakta oss</a></li>
                    <!-- Länk till om-sidan -->
                    <li class="nav-list-item"><a href="../pages/about.html">Om oss</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <!-- Hero-sektion med stor bild och rubrik -->
            <section class="hero">
                <div class="hero-content">
                    <h1 class="hero-titel">Belarussisk fine dining i Stockholm</h1>
                    <p class="hero-text">
                        Välkommen till Vaviorka - en hyllning till det belarussiska köket.
                        Här möts traditionella smaker och moderna tekniker i en varm, elegant miljö.
                    </p>
                    <!-- Knappar för att scrolla till menyn eller boka bord -->
                    <div class="hero-actions">
                        <a href="#menu-section" class="btn btn-secondary">Se menyn</a>
                        <a href="../pages/booking.html" class="btn btn-primary">Boka bord</a>
                    </div>
                </div>
            </section>
            <!-- Container där menyn visas -->
            <div id="menu-section">

            </div>
        </main>

        <!-- Sidfoten med kontaktuppgifter -->
        <footer class="footer">
            <ul class="footer-list">
                <!-- Telefonnummer -->
                <li class="footer-list-item ">+467890970509</li>
                <!-- E-postadress -->
                <li class="footer-list-item">vaviorkadining@hotmail.com</li>
            </ul>
        </footer>
        <!-- JavaScript som hämtar menyn från backend och visar den i #menu-section -->
        <script src="../js/menu.js"></script>
    </body>
</html>
